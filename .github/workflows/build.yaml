name: build
on:
  push:
    branches:
      - "master"
      - "main"
    tags:
      - "!*"
  pull_request:
    branches:
      - "*"
jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.60
  build:
    runs-on: ubuntu-latest
    name: build
    needs: linting
    steps:
    - name: Set up Go 1.23
      uses: actions/setup-go@v5
      with:
        go-version: 1.23
    - name: Checkout
      uses: actions/checkout@v4
    - name: Get dependencies
      run: make deps
    - name: Build & Test
      run: make build
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "dmolik/gitlab-extra-exporter:${{ github.sha }}"
        format: "table"
        exit-code: "1"
        ignore-unfixed: true
        severity: "CRITICAL,HIGH"
